name: Refresh profile
on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - profile.json
      - .github/workflows/profile.yml
permissions:
  contents: write
concurrency:
  group: profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check categorization and public-only filtering
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Generate profile from public repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py
      - name: Save changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public project directory'
            git push
          fi
